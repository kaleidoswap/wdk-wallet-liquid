name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: Lint & test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - name: Lint (standard)
        run: npx standard

      - name: Test (jest, node #lwk binding)
        run: npm test
